document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px\">\n      <span>In an emergency, or if you are in danger, call <a href=\"tel:999\" style=\"color:#fff;font-weight:700\">999<\u002Fa> (free).<\u002Fspan>\n      <span>If you cannot speak, call 999 then press 5 and 5.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main id=\"main\" style=\"max-width:760px;margin:0 auto;padding:0 18px 8px\">\n\n    <div style=\"padding:26px 0 4px\">\n      <h1 style=\"font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:32px;line-height:1.15;margin:4px 0 8px;color:#1D263B;font-weight:700;text-wrap:balance\">Find support in Manchester<\u002Fh1>\n      <div style=\"width:68px;height:5px;border-radius:999px;background:#00DCF9;margin:0 0 4px\"><\u002Fdiv>\n      <p style=\"font-size:18px;color:#47515F;margin:6px 0 0;max-width:46ch;text-wrap:pretty\">Community groups, wellbeing activities, volunteering and support near you. Search or choose a topic to see who can help. This page keeps nothing you tap.<\u002Fp>\n    <\u002Fdiv>\n\n    <section aria-labelledby=\"needs-h\" style=\"margin:24px 0 6px\">\n      <h2 id=\"needs-h\" style=\"font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:23px;color:#1D263B;font-weight:700;margin:0 0 4px;line-height:1.2\">What would help right now?<\u002Fh2>\n      <p style=\"font-size:16px;color:#47515F;margin:0 0 14px;text-wrap:pretty\">Pick anything that fits — you can choose more than one, and build your own list of support.<\u002Fp>\n      <div role=\"group\" aria-labelledby=\"needs-h\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px\">\n        <sc-for list=\"{{ needsList }}\" as=\"need\" hint-placeholder-count=\"8\">\n          <button type=\"button\" onclick=\"{{ need.onToggle }}\" aria-pressed=\"{{ need.picked }}\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;text-align:center;min-height:142px;padding:22px 14px 16px;border-radius:16px;border:2px solid {{ need.borderColor }};background:{{ need.bg }};color:#1D263B;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.3\">\n            <span aria-hidden=\"true\" style=\"position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;border:2px solid {{ need.tickBorder }};background:{{ need.tickBg }};display:grid;place-items:center\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:{{ need.tickOpacity }}\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:{{ need.iconBg }};color:#106FBD\">\n              <svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"{{ need.iconPath }}\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span>{{ need.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px\">\n        <button type=\"button\" onclick=\"{{ showMine }}\" disabled=\"{{ showDisabled }}\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:13px 26px;border-radius:999px;border:2px solid transparent;background:{{ showBtnBg }};color:#fff;font-size:17px;font-weight:700;cursor:{{ showBtnCursor }};font-family:inherit;line-height:1.2\">Show my support<\u002Fbutton>\n        <sc-if value=\"{{ mineMode }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" onclick=\"{{ resetMine }}\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:13px 22px;border-radius:999px;border:2px solid #106FBD;background:#fff;color:#1D263B;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.2\">Start again<\u002Fbutton>\n        <\u002Fsc-if>\n        <span aria-live=\"polite\" style=\"font-size:15px;color:#47515F\">{{ pickedStatus }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"height:1px;background:#CBD5DF;margin:20px 0 2px\"><\u002Fdiv>\n\n    <div style=\"margin:22px 0 6px\">\n      <label for=\"q\" style=\"display:block;font-weight:700;font-size:17px;color:#1D263B;margin:0 0 8px\">Or search all topics<\u002Flabel>\n      <div style=\"position:relative\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#106FBD\"><path fill=\"currentColor\" d=\"M10 2a8 8 0 1 0 5 14.3l5.3 5.4 1.4-1.4-5.4-5.3A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z\"><\u002Fpath><\u002Fsvg>\n        <input id=\"q\" type=\"search\" inputmode=\"search\" autocomplete=\"off\" placeholder=\"Try: anxious, housing, autism, women…\" value=\"{{ query }}\" onchange=\"{{ onSearch }}\" oninput=\"{{ onSearch }}\" style=\"width:100%;box-sizing:border-box;min-height:58px;padding:14px 16px 14px 48px;font-size:18px;border:2px solid #CBD5DF;border-radius:14px;background:#fff;color:#1D263B;font-family:inherit\">\n      <\u002Fdiv>\n\n\n      <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap\">\n          <span aria-live=\"polite\" style=\"font-size:16px;color:#47515F\">{{ statusText }}<\u002Fspan>\n          <button type=\"button\" onclick=\"{{ clearQuery }}\" style=\"display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid #106FBD;background:#fff;color:#1D263B;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit\">Clear search<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showTapHint }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-size:16px;color:#47515F;margin:18px 0 0\">Tap a topic to see the groups who can help.<\u002Fp>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ mineMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin:24px 0 2px\">\n        <h2 style=\"font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:24px;color:#1D263B;font-weight:700;margin:0 0 2px;line-height:1.2\">Your support<\u002Fh2>\n        <p style=\"font-size:16px;color:#47515F;margin:2px 0 0\">{{ mineStatus }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin:16px 0 8px\">\n      <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"6\">\n        <div style=\"border:2px solid {{ cat.borderColor }};border-radius:16px;background:#fff;overflow:hidden\">\n\n          <button type=\"button\" onclick=\"{{ cat.onToggle }}\" aria-expanded=\"{{ cat.open }}\" style=\"width:100%;display:flex;align-items:center;gap:14px;min-height:68px;padding:16px 18px;background:#fff;border:none;font-size:19px;font-weight:700;color:#1D263B;cursor:pointer;text-align:left;font-family:inherit;line-height:1.25\">\n            <span aria-hidden=\"true\" style=\"flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#E9EEF5;color:#106FBD\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"{{ cat.iconPath }}\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"flex:1 1 auto\">{{ cat.label }}<\u002Fspan>\n            <sc-if value=\"{{ cat.showCount }}\" hint-placeholder-val=\"{{ true }}\">\n              <span aria-hidden=\"true\" style=\"flex:none;font-size:14px;font-weight:700;color:#106FBD;background:#E9EEF5;border-radius:999px;padding:3px 11px\">{{ cat.count }}<\u002Fspan>\n            <\u002Fsc-if>\n            <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" style=\"flex:none;color:#106FBD;transform:{{ cat.chevTransform }};transition:transform .2s ease\"><path fill=\"currentColor\" d=\"M12 15.5 5.5 9l1.4-1.4L12 12.7l5.1-5.1L18.5 9 12 15.5Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n\n          <sc-if value=\"{{ cat.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:2px 18px 20px;border-top:1px solid #CBD5DF\">\n\n              <sc-if value=\"{{ cat.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:16px;color:#47515F;background:#F4F7FB;border-left:4px solid #106FBD;padding:12px 14px;border-radius:8px;margin:14px 0 4px;line-height:1.55\">\n                  <sc-for list=\"{{ cat.noteSegments }}\" as=\"seg\" hint-placeholder-count=\"3\">\n                    <sc-if value=\"{{ seg.isText }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ seg.v }}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ seg.isLink }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ seg.href }}\" style=\"color:#1D263B;font-weight:700\">{{ seg.v }}<\u002Fa><\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ cat.hasFirstStep }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#E9EEF5;border:2px solid #106FBD;border-radius:12px;padding:14px 16px;margin:14px 0 4px\">\n                  <p style=\"margin:0 0 4px;color:#1D263B;font-size:17px;line-height:1.55\"><strong>{{ cat.firstStepTitle }}<\u002Fstrong> {{ cat.firstStepBody }}<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n                    <sc-for list=\"{{ cat.firstStepActions }}\" as=\"action\" hint-placeholder-count=\"2\">\n                      <sc-if value=\"{{ action.primary }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"{{ action.href }}\" aria-label=\"{{ action.ariaLabel }}\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border-radius:999px;background:#106FBD;color:#fff;font-size:16px;font-weight:700;text-decoration:none;line-height:1.2;border:2px solid transparent\">{{ action.label }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ action.notPrimary }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ action.href }}\" target=\"{{ action.target }}\" rel=\"noopener\" aria-label=\"{{ action.ariaLabel }}\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border-radius:999px;background:#fff;color:#1D263B;font-size:16px;font-weight:700;text-decoration:none;line-height:1.2;border:2px solid #106FBD\">{{ action.label }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <p style=\"font-size:15px;color:#47515F;margin:12px 0 0;line-height:1.55\">\n                    <sc-for list=\"{{ cat.firstStepNoteSegments }}\" as=\"seg\" hint-placeholder-count=\"2\">\n                      <sc-if value=\"{{ seg.isText }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ seg.v }}<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ seg.isLink }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ seg.href }}\" style=\"color:#1D263B;font-weight:700\">{{ seg.v }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fsc-for>\n                  <\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ cat.hasFilters }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px\">\n                  <span style=\"font-size:14px;font-weight:700;color:#1D263B\">Filter:<\u002Fspan>\n                  <sc-for list=\"{{ cat.filterChips }}\" as=\"fc\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" onclick=\"{{ fc.onToggle }}\" aria-pressed=\"{{ fc.active }}\" style=\"display:inline-flex;align-items:center;min-height:38px;padding:6px 13px;border-radius:999px;border:2px solid {{ fc.border }};background:{{ fc.bg }};color:{{ fc.color }};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.2\">{{ fc.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-for list=\"{{ cat.orgs }}\" as=\"org\" hint-placeholder-count=\"3\">\n                <div style=\"padding:16px 0;border-bottom:1px solid #E5EDEA\">\n                  <sc-if value=\"{{ org.matched }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#1D263B;background:#D6F5FB;border-radius:999px;padding:4px 11px 4px 9px;margin:0 0 8px\">\n                      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1D263B\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n                      Matches you\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                  <h3 style=\"margin:2px 0 4px;font-size:19px;color:#1D263B;font-weight:700;line-height:1.3\">{{ org.name }}<\u002Fh3>\n                  <p style=\"margin:4px 0;color:#47515F;font-size:17px;line-height:1.5;text-wrap:pretty\">{{ org.desc }}<\u002Fp>\n                  <sc-if value=\"{{ org.hasWho }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px\">\n                      <span style=\"font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7A828E;margin-right:2px\">For<\u002Fspan>\n                      <sc-for list=\"{{ org.whoPills }}\" as=\"pill\" hint-placeholder-count=\"2\">\n                        <sc-if value=\"{{ pill.on }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:#fff;background:#106FBD;border-radius:999px;padding:3px 10px\">{{ pill.label }}<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ pill.off }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:#1D263B;background:#EDF1F6;border:1px solid #CBD5DF;border-radius:999px;padding:3px 10px\">{{ pill.label }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ org.hasOffers }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px\">\n                      <span style=\"font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7A828E;margin-right:2px\">Offers<\u002Fspan>\n                      <sc-for list=\"{{ org.offerPills }}\" as=\"pill\" hint-placeholder-count=\"2\">\n                        <sc-if value=\"{{ pill.on }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#1D263B;background:#FECB68;border-radius:999px;padding:3px 10px\">{{ pill.label }}<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ pill.off }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#6E5312;background:#FFF3D9;border:1px solid #F3D89A;border-radius:999px;padding:3px 10px\">{{ pill.label }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px\">\n                    <sc-for list=\"{{ org.actions }}\" as=\"action\" hint-placeholder-count=\"2\">\n                      <sc-if value=\"{{ action.primary }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"{{ action.href }}\" aria-label=\"{{ action.ariaLabel }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:999px;background:#106FBD;color:#fff;font-size:16px;font-weight:700;text-decoration:none;line-height:1.2;border:2px solid transparent\">{{ action.label }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ action.notPrimary }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ action.href }}\" target=\"{{ action.target }}\" rel=\"noopener\" aria-label=\"{{ action.ariaLabel }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:999px;background:#fff;color:#1D263B;font-size:16px;font-weight:700;text-decoration:none;line-height:1.2;border:2px solid #106FBD\">{{ action.label }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n\n              <sc-if value=\"{{ cat.hasEndNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:16px;color:#47515F;background:#F4F7FB;border-left:4px solid #106FBD;padding:12px 14px;border-radius:8px;margin:14px 0 2px;line-height:1.55\">{{ cat.endNote }}<\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ cat.isFillIn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <p style=\"font-size:17px;color:#47515F;margin:14px 0 0;line-height:1.55\">Our Student Support team is here for you. They are kind, and they keep things private. They can help with most things on this page.<\u002Fp>\n                  <div style=\"border:2px solid #106FBD;background:#F4F7FB;border-radius:12px;padding:16px 18px;margin-top:12px\">\n                    <div style=\"display:flex;flex-direction:column;gap:14px\">\n                      <div>\n                        <p style=\"margin:0 0 6px;font-size:17px;font-weight:700;color:#1D263B\">iCentre<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                          <a href=\"mailto:icentre@manchester.ugm.ac.uk\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 15px;border-radius:999px;background:#106FBD;color:#fff;font-size:15px;font-weight:700;text-decoration:none;line-height:1.2\">✉ icentre@manchester.ugm.ac.uk<\u002Fa>\n                          <a href=\"tel:01613885595\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 15px;border-radius:999px;background:#fff;color:#1D263B;font-size:15px;font-weight:700;text-decoration:none;line-height:1.2;border:2px solid #106FBD\">☎ 0161 388 5595 · option 1<\u002Fa>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div>\n                        <p style=\"margin:0 0 6px;font-size:17px;font-weight:700;color:#1D263B\">Student Wellbeing<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                          <a href=\"mailto:studentwellbing@manchester.ugm.ac.uk\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 15px;border-radius:999px;background:#106FBD;color:#fff;font-size:15px;font-weight:700;text-decoration:none;line-height:1.2\">✉ studentwellbing@manchester.ugm.ac.uk<\u002Fa>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:2px solid #CBD5DF;border-radius:16px;padding:20px;margin:8px 0;font-size:17px;color:#47515F;line-height:1.55\">\n        No topics match <strong style=\"color:#1D263B\">\"{{ query }}\"<\u002Fstrong>. Try a shorter or different word, or open <strong style=\"color:#1D263B\">\"Talk to our Student Support team\"<\u002Fstrong> — they can help with most things.\n        <div style=\"margin-top:14px\"><button type=\"button\" onclick=\"{{ clearQuery }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:9px 16px;border-radius:999px;border:2px solid #106FBD;background:#fff;color:#1D263B;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit\">Clear search<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid #CBD5DF;padding:26px 18px 40px;margin-top:12px;color:#47515F;font-size:16px\">\n    <div style=\"max-width:760px;margin:0 auto\">\n      <p style=\"margin:0 0 8px\">In an emergency, always call <a href=\"tel:999\" style=\"color:#1D263B;font-weight:700\">999<\u002Fa>.<\u002Fp>\n      <p style=\"margin:0\">This page keeps nothing you tap. Information last checked: 30 June 2026.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:920},&quot;quickExitUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://www.manchester.ugm.ac.uk/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showQuickExit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;startExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = { query: '', open: {}, picked: {}, showMine: false, filter: {} };\n\n  componentDidMount() {\n    this._onKey = (e) => { if (e.key === 'Escape') this.leave(); };\n    document.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() {\n    if (this._onKey) document.removeEventListener('keydown', this._onKey);\n  }\n\n  leave() {\n    const url = this.props.quickExitUrl || 'https://www.bbc.co.uk/weather';\n    try { window.location.replace(url); } catch (e) { window.location.href = url; }\n  }\n\n  toggle(id) {\n    this.setState((s) => ({ open: { ...s.open, [id]: !this._isOpen(id, s) } }));\n  }\n  _isOpen(id, s) {\n    const v = s.open[id];\n    if (v === undefined) return !!this.props.startExpanded;\n    return v;\n  }\n  setQuery(q) { this.setState({ query: q, showMine: false }); }\n\n  togglePick(id) {\n    this.setState((s) => ({ picked: { ...s.picked, [id]: !s.picked[id] }, showMine: false }));\n  }\n  showMine() {\n    const picked = Object.keys(this.state.picked || {}).filter((k) => this.state.picked[k]);\n    if (picked.length) this.setState({ showMine: true, query: '' });\n  }\n  resetMine() { this.setState({ picked: {}, showMine: false }); }\n\n  setFilter(catId, tag) {\n    this.setState((s) => {\n      const cur = s.filter[catId] || '';\n      const next = (cur === tag) ? '' : tag;\n      return { filter: { ...s.filter, [catId]: next } };\n    });\n  }\n\n  // What a student's first-person pick maps to, for auto-matching orgs inside every category.\n  _autoMap() {\n    return { lgbt: ['lgbt'], women: ['women'], autism: ['autism'], homeless: ['refugee'] };\n  }\n  // Human-readable label for each org tag (audience + service).\n  _tagLabels() {\n    return {\n      // who it's for\n      lgbt: 'LGBT+', women: 'Women', autism: 'Neurodivergent',\n      refugee: 'Refugees & asylum', carer: 'Carers', interview: 'Interview coming up',\n      youth: 'Young people 13–25', southasian: 'South Asian women',\n      domestic: 'Domestic abuse', language: 'Other languages',\n      // what they offer\n      helpline: 'Helpline', counselling: 'Counselling', groups: 'Groups & community',\n      activities: 'Activities & workshops', befriending: 'Befriending',\n      advice: 'Advice & advocacy', housing: 'Housing help', food: 'Food & essentials',\n      employability: 'Skills & employability', volunteering: 'Volunteer roles'\n    };\n  }\n  // The service tags (what an org offers). Everything else is an audience tag.\n  _serviceTags() {\n    return { helpline: 1, counselling: 1, groups: 1, activities: 1, befriending: 1, advice: 1, housing: 1, food: 1, employability: 1, volunteering: 1 };\n  }\n  // What each organisation offers, keyed by its name.\n  _serviceByName() {\n    return {\n      'Boaz Trust': ['housing', 'food'],\n      'Independent Choices Greater Manchester': ['helpline', 'advice'],\n      'Inner Space Manchester': ['activities'],\n      '42nd Street': ['counselling', 'helpline'],\n      'LGBT Foundation': ['helpline', 'groups', 'befriending'],\n      'Respect for All': ['counselling', 'groups'],\n      'The Proud Trust': ['groups', 'befriending'],\n      'Smart Works Greater Manchester': ['employability'],\n      'Angels of Hope for Women': ['activities', 'groups'],\n      'MRSN — Manchester Refugee Support Network': ['advice', 'volunteering'],\n      'Gaddum': ['counselling', 'volunteering'],\n      'Wonderfully Made Woman': ['activities', 'befriending'],\n      'Discovering Calm': ['activities'],\n      'CAHN — Caribbean & African Health Network': ['activities', 'groups'],\n      'Reet Good MiNDs': ['activities', 'groups'],\n      'I AM — Celebrating Autism in Greater Manchester': ['activities', 'groups'],\n      'Better Things': ['groups', 'befriending'],\n      \"Manchester Women's Aid\": ['advice', 'groups'],\n      'WAST — Women Asylum Seekers Together': ['groups', 'activities'],\n      'Ananna — Manchester Bangladeshi Women’s Organisation': ['advice', 'activities'],\n      \"Women's Voices Longsight\": ['groups', 'activities'],\n \n      if (q && !labelMatch) {\n        orgs = cat.orgs.filter((o) => (o.name + ' ' + o.desc).toLowerCase().includes(q));\n      }\n      const contentMatch = labelMatch || orgs.length > 0 || (cat.isFillIn && labelMatch);\n      if (q && !contentMatch) return;\n\n      const open = q ? true : this._isOpen(cat.id, s);\n      out.push(this._viewCat(cat, orgs, open, ctxFor(cat.id)));\n    });\n    }\n\n    const needLabels = {\n      wellbeing: 'I feel low or anxious',\n      activities: 'I want to try activities',\n      autism: \"I'm neurodivergent\",\n      lgbt: \"I'm LGBT+\",\n      women: \"I want women's support\",\n      volunteer: 'I want to volunteer',\n      homeless: \"I've nowhere safe to stay\",\n      student: 'I just want to talk'\n    };\n    const needOrder = ['wellbeing', 'activities', 'autism', 'lgbt', 'women', 'volunteer', 'homeless', 'student'];\n    const catIcon = {};\n    cats.forEach((c) => { catIcon[c.id] = c.iconPath; });\n    // Picker-only icon overrides (leave the topic-card icons unchanged).\n    const needIcons = {\n      wellbeing: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z' +\n        'M9 10.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z' +\n        'M15 10.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z' +\n        'M7.4 8.9 9.9 7.8 10.2 8.6 7.7 9.7Z' +\n        'M16.6 8.9 14.1 7.8 13.8 8.6 16.3 9.7Z' +\n        'M8.7 17.4Q12 14.4 15.3 17.4 12 15.7 8.7 17.4Z'\n    };\n    const needsList = needOrder.map((id) => {\n      const on = !!s.picked[id];\n      return {\n        id, label: needLabels[id], iconPath: needIcons[id] || catIcon[id], picked: on,\n        onToggle: () => this.togglePick(id),\n        borderColor: on ? '#106FBD' : '#CBD5DF',\n        bg: on ? '#E9EEF5' : '#fff',\n        iconBg: on ? '#CFE0F2' : '#E9EEF5',\n        tickBorder: on ? '#106FBD' : '#B9C2CF',\n        tickBg: on ? '#106FBD' : '#fff',\n        tickOpacity: on ? '1' : '0'\n      };\n    });\n    const pickedCount = picked.length;\n    const canShow = pickedCount > 0;\n\n    const chipDefs = [\n      { label: 'Anxious / stressed', term: 'anxiety' },\n      { label: 'Housing', term: 'homeless' },\n      { label: 'Autism', term: 'autism' },\n      { label: 'LGBT+', term: 'lgbt' },\n      { label: 'Women', term: 'women' },\n      { label: 'Volunteering', term: 'volunteer' }\n    ];\n    const chips = chipDefs.map((c) => ({ label: c.label, onSelect: () => this.setQuery(c.term) }));\n\n    const topicWord = out.length === 1 ? 'topic' : 'topics';\n\n    return {\n      query: s.query || '',\n      hasQuery,\n      showTapHint: !hasQuery && !mineMode,\n      statusText: hasQuery ? (out.length + ' ' + topicWord + ' for \"' + (s.query || '').trim() + '\"') : '',\n      noResults: hasQuery && out.length === 0,\n      categories: out,\n      chips,\n      needsList,\n      mineMode,\n      showMine: () => this.showMine(),\n      resetMine: () => this.resetMine(),\n      showDisabled: !canShow,\n      showBtnBg: canShow ? '#106FBD' : '#C2CAD6',\n      showBtnCursor: canShow ? 'pointer' : 'not-allowed',\n      pickedStatus: pickedCount ? (pickedCount + ' selected') : '',\n      mineStatus: mineMode ? ('Based on what you picked — ' + out.length + (out.length === 1 ? ' area of support.' : ' areas of support.')) : '',\n      showQuickExit: this.props.showQuickExit !== false,\n      onSearch: (e) => this.setQuery(e.target.value),\n      clearQuery: () => this.setQuery(''),\n      quickExit: () => this.leave(),\n      noop: () => {}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
